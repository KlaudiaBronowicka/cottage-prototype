<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cottage — encounter prototype (greybox)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">THE COTTAGE · greybox prototype</span>
  <span id="seedLabel" class="muted"></span>
  <span class="spacer"></span>
  <button id="btnRules" title="Quick rules">Rules</button>
  <button id="btnStats" title="Run stats (saved in this browser)">Stats</button>
  <button id="btnDebug" title="Toggle debug panel (key: D)">Debug</button>

<main id="app"></main>
<aside id="debug" class="hidden"></aside>
<div id="overlay" class="hidden"><div id="overlayBox"></div></div>
<!-- load order: tuning, text, engine, stats, UI -->
<script src="config.js"></script>
